<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Kavkaz</title>
  </head>
  <body>
    <div class="app">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('new-order')">
          New order
        </button>
        <button class="tab" onclick="switchTab('menu')">Menu & prices</button>
        <button class="tab" onclick="switchTab('daily')">Daily report</button>
      </div>

      <div id="tab-new-order" class="section active">
        <div class="order-builder">
          <div class="order-items-list" id="order-items-list">
            <div class="loading">Loading menu...</div>
          </div>
          <div class="summary-card">
            <div class="summary-title">Order summary</div>
            <div class="summary-lines" id="summary-lines">
              <div
                style="
                  font-size: 13px;
                  color: var(--color-text-secondary);
                  padding: 4px 0;
                "
              >
                No items added yet
              </div>
            </div>
            <hr class="divider" />
            <div class="total-row">
              <span>Total</span><span id="order-total">₾0.00</span>
            </div>
            <hr class="divider" />
            <textarea
              class="note-input"
              id="order-note"
              placeholder="Order note (optional)..."
            ></textarea>
            <button
              class="place-btn"
              id="place-btn"
              onclick="placeOrder()"
              disabled
            >
              Place order
            </button>
          </div>
        </div>
      </div>

      <div id="tab-menu" class="section">
        <div class="menu-grid" id="menu-grid">
          <div class="loading">Loading menu...</div>
        </div>
        <div class="add-item-form">
          <h3>Add new menu item</h3>
          <div class="form-row">
            <input type="text" id="new-item-name" placeholder="Item name" />
            <span class="currency">₾</span>
            <input
              type="number"
              id="new-item-price"
              placeholder="Price"
              min="0"
              step="0.01"
            />
            <button class="save-btn" onclick="addMenuItem()">Add item</button>
          </div>
          <div class="error-msg" id="add-error"></div>
        </div>
      </div>

      <div id="tab-daily" class="section">
        <div class="day-stats">
          <div class="stat-card">
            <div class="stat-label">Total earnings</div>
            <div class="stat-value" id="stat-earnings">₾0.00</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Orders today</div>
            <div class="stat-value" id="stat-orders">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Avg order value</div>
            <div class="stat-value" id="stat-avg">₾0.00</div>
          </div>
        </div>
        <div class="orders-list" id="orders-list">
          <div class="loading">Loading orders...</div>
        </div>
        <div style="margin-top: 1rem; display: flex; justify-content: flex-end">
          <button class="clear-btn" onclick="clearDay()">Clear day</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
